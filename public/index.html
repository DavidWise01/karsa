<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΔΩΔΕΚΑΚΥΚΛΟΣ // ALGOL 68 // REV 2026</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap');
    
    :root {
        --bg: #020210;
        --glass: rgba(255,255,255,0.06);
        --glass-border: rgba(255,255,255,0.18);
        --text: #e8eaf6;
        --text-dim: #8b92b0;
        --glow: rgba(180,200,255,0.3);
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        user-select: none;
        position: fixed;
    }
    
    /* Nebula Background */
    body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
            radial-gradient(2px 2px at 20% 30%, #fff, transparent),
            radial-gradient(2px 2px at 60% 70%, #fff, transparent),
            radial-gradient(1px 1px at 50% 50%, #fff, transparent),
            radial-gradient(ellipse at 20% 20%, #0a0a2a 0%, transparent 50%),
            radial-gradient(ellipse at 80% 80%, #1a0a3a 0%, transparent 50%),
            radial-gradient(ellipse at 50% 50%, #0a1a3a 0%, transparent 70%);
        background-size: 550px 550px, 350px 350px, 250px 250px, 100% 100%;
        animation: nebulaDrift 120s linear infinite;
        z-index: 0;
    }
    
    @keyframes nebulaDrift {
        0% { transform: rotate(0deg) translate(0, 0); }
        100% { transform: rotate(360deg) translate(50px, 50px); }
    }
    
    #canvas-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    
    /* Top Bar */
    .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(180deg, rgba(2,2,16,0.8) 0%, transparent 100%);
        backdrop-filter: blur(20px);
    }
    
    .header-title {
        font-family: 'Cinzel', serif;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        background: linear-gradient(135deg, #fff 0%, #a0a8ff 50%, #d0a0ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px var(--glow);
    }
    
    .header-subtitle {
        font-size: 0.75rem;
        color: var(--text-dim);
        letter-spacing: 0.3em;
        margin-top: 2px;
    }
    
    .header-controls {
        display: flex;
        gap: 15px;
        align-items: center;
    }
    
    .control-btn {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(50px);
        padding: 8px 16px;
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font-size: 0.75rem;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
    }
    
    .control-btn:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.3);
        box-shadow: 0 0 20px rgba(160,168,255,0.2);
    }
    
    /* Stage */
    #stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
    }
    
    /* God Window */
    .god-window {
        position: absolute;
        width: 380px;
        height: 420px;
        background: var(--glass);
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border-radius: 16px;
        box-shadow: 
            0 8px 32px rgba(0,0,0,0.4),
            inset 0 1px 0 rgba(255,255,255,0.1);
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: move;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 1;
    }
    
    .god-window::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 2px;
        background: var(--deity-gradient);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0.6;
        transition: opacity 0.3s ease;
    }
    
    .god-window.active {
        transform: scale(1.05) translateZ(0);
        z-index: 50 !important;
        box-shadow: 
            0 20px 60px rgba(0,0,0,0.6),
            0 0 80px var(--deity-glow),
            inset 0 1px 0 rgba(255,255,255,0.2);
    }
    
    .god-window.active::before {
        opacity: 1;
        animation: holographicFlare 2s ease-in-out infinite;
    }
    
    @keyframes holographicFlare {
        0%, 100% { opacity: 0.8; filter: brightness(1); }
        50% { opacity: 1; filter: brightness(1.5); }
    }
    
    .god-window.dimmed {
        opacity: 0.4;
        filter: saturate(0.5);
    }
    
    .god-window.dragging {
        transition: none;
        cursor: grabbing;
    }
    
    .window-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
    }
    
    .god-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    
    .god-name-greek {
        font-family: 'Cinzel', serif;
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--text);
        letter-spacing: 0.05em;
    }
    
    .god-name-english {
        font-size: 0.7rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }
    
    .month-tag {
        font-size: 0.65rem;
        padding: 4px 10px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        color: var(--text-dim);
        font-weight: 500;
    }
    
    .window-body {
        flex: 1;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .code-editor {
        flex: 1;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 8px;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        color: #a8c5ff;
        overflow: auto;
        resize: none;
        outline: none;
        line-height: 1.6;
    }
    
    .code-editor:focus {
        border-color: rgba(160,168,255,0.3);
        box-shadow: inset 0 0 20px rgba(160,168,255,0.05);
    }
    
    .run-btn {
        padding: 10px;
        background: linear-gradient(135deg, rgba(160,168,255,0.15), rgba(208,160,255,0.15));
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        color: var(--text);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }
    
    .run-btn:hover {
        background: linear-gradient(135deg, rgba(160,168,255,0.25), rgba(208,160,255,0.25));
        border-color: rgba(255,255,255,0.25);
        box-shadow: 0 0 20px rgba(160,168,255,0.2);
    }
    
    /* Console */
    #console-window {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 200px;
        background: var(--glass);
        backdrop-filter: blur(50px);
        border-radius: 16px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        z-index: 90;
        display: flex;
        flex-direction: column;
    }
    
    .console-header {
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-family: 'Cinzel', serif;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .console-output {
        flex: 1;
        padding: 15px 20px;
        font-family: 'Courier New', monospace;
        font-size: 0.7rem;
        color: #8be9fd;
        overflow-y: auto;
        line-height: 1.6;
    }
    
    .console-line {
        margin-bottom: 4px;
        opacity: 0;
        animation: fadeInLine 0.3s forwards;
    }
    
    @keyframes fadeInLine {
        to { opacity: 1; }
    }
    
    .console-line.error { color: #ff6b6b; }
    .console-line.success { color: #51cf66; }
    .console-line.info { color: #74c0fc; }
    
    .clear-console {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 4px 10px;
        border-radius: 6px;
        color: var(--text-dim);
        font-size: 0.65rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .clear-console:hover {
        background: rgba(255,255,255,0.1);
    }
    
    /* Keybinds hint */
    .keybinds {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 100;
        background: var(--glass);
        backdrop-filter: blur(50px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 15px 20px;
        font-size: 0.7rem;
        color: var(--text-dim);
        line-height: 1.8;
    }
    
    .keybinds kbd {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.65rem;
    }
    
    /* God-specific colors */
    .god-hera { 
        --deity-gradient: conic-gradient(from 0deg, #ffd700, #ff6b9d, #c06bff, #ffd700);
        --deity-glow: rgba(255,215,0,0.4);
    }
    .god-poseidon { 
        --deity-gradient: conic-gradient(from 0deg, #00d9ff, #0088ff, #0055ff, #00d9ff);
        --deity-glow: rgba(0,217,255,0.4);
    }
    .god-athena { 
        --deity-gradient: conic-gradient(from 0deg, #b0b0b0, #e0e0e0, #a0a0a0, #b0b0b0);
        --deity-glow: rgba(176,176,176,0.4);
    }
    .god-aphrodite { 
        --deity-gradient: conic-gradient(from 0deg, #ff6b9d, #ffa6c9, #ff1744, #ff6b9d);
        --deity-glow: rgba(255,107,157,0.4);
    }
    .god-apollo { 
        --deity-gradient: conic-gradient(from 0deg, #ffeb3b, #ffc107, #ff9800, #ffeb3b);
        --deity-glow: rgba(255,235,59,0.4);
    }
    .god-artemis { 
        --deity-gradient: conic-gradient(from 0deg, #c0c0ff, #8080ff, #a0a0ff, #c0c0ff);
        --deity-glow: rgba(192,192,255,0.4);
    }
    .god-ares { 
        --deity-gradient: conic-gradient(from 0deg, #ff3333, #cc0000, #8b0000, #ff3333);
        --deity-glow: rgba(255,51,51,0.4);
    }
    .god-hermes { 
        --deity-gradient: conic-gradient(from 0deg, #40e0d0, #20b2aa, #00ced1, #40e0d0);
        --deity-glow: rgba(64,224,208,0.4);
    }
    .god-hephaestus { 
        --deity-gradient: conic-gradient(from 0deg, #ff6b35, #ff4500, #dc143c, #ff6b35);
        --deity-glow: rgba(255,107,53,0.4);
    }
    .god-demeter { 
        --deity-gradient: conic-gradient(from 0deg, #8bc34a, #4caf50, #689f38, #8bc34a);
        --deity-glow: rgba(139,195,74,0.4);
    }
    .god-dionysus { 
        --deity-gradient: conic-gradient(from 0deg, #9c27b0, #673ab7, #3f51b5, #9c27b0);
        --deity-glow: rgba(156,39,176,0.4);
    }
    .god-zeus { 
        --deity-gradient: conic-gradient(from 0deg, #64b5f6, #2196f3, #1976d2, #64b5f6);
        --deity-glow: rgba(100,181,246,0.5);
    }
    
    @media (max-width: 768px) {
        .god-window {
            width: 320px;
            height: 380px;
        }
        .header {
            padding: 15px 20px;
            flex-direction: column;
            gap: 10px;
        }
        .header-title {
            font-size: 1.1rem;
        }
        #console-window {
            width: 90%;
            height: 150px;
        }
        .keybinds {
            display: none;
        }
    }
</style>
</head>
<body>
<div class="header">
    <div>
        <div class="header-title">ΔΩΔΕΚΑΚΥΚΛΟΣ</div>
        <div class="header-subtitle">11 + 1 = 12 // THE ROOT // ALGOL 68</div>
    </div>
    <div class="header-controls">
        <button class="control-btn" id="pauseOrbit">PAUSE ORBIT</button>
        <button class="control-btn" id="resetFormation">RESET CIRCLE</button>
    </div>
</div>

<canvas id="canvas-bg"></canvas>
<div id="stage"></div>

<div id="console-window">
    <div class="console-header">
        <span>ORACLE CONSOLE // ΚΟΙΝΗ ΕΞΟΔΟΣ</span>
        <button class="clear-console" id="clearConsole">CLEAR</button>
    </div>
    <div class="console-output" id="consoleOutput"></div>
</div>

<div class="keybinds">
    <div><kbd>1-9</kbd><kbd>0</kbd><kbd>-</kbd><kbd>=</kbd> Focus Gods</div>
    <div><kbd>Space</kbd> Pause Orbit</div>
    <div><kbd>Double Click</kbd> Reset Formation</div>
</div>

<script>
const GODS = {
    HERA: {
        month: 'JAN', greek: 'Ἥρα', english: 'HERA', 
        desc: 'Queen, Marriage, Hearth',
        chord: 261.63, // C4
        code: `# HERA - Records and Union\n# BEGIN\n  MODE MARRIAGE = STRUCT(STRING husband, wife, INT year);\n  MARRIAGE olympus := ("Zeus", "Hera", 1);\n  print(("Hearth established:", husband OF olympus, wife OF olympus))\n# END`,
        color: 'god-hera'
    },
    POSEIDON: {
        month: 'FEB', greek: 'Ποσειδῶν', english: 'POSEIDON',
        desc: 'Seas, Earthquakes, Horses',
        chord: 293.66, // D4
        code: `# POSEIDON - Waves and Arrays\n# BEGIN\n  [1:5] REAL waves;\n  FOR i FROM 1 TO 5 DO\n    waves[i] := sin(i * pi / 3)\n  OD;\n  print(("Tidal array:", waves))\n# END`,
        color: 'god-poseidon'
    },
    ATHENA: {
        month: 'MAR', greek: 'Ἀθηνᾶ', english: 'ATHENA',
        desc: 'Wisdom, Strategy, Craft',
        chord: 329.63, // E4
        code: `# ATHENA - Strategic Logic\n# BEGIN\n  BOOL victory := TRUE;\n  INT strength := 100;\n  PROC owl = BOOL: (strength > 50 AND victory);\n  print(("Strategic outcome:", owl))\n# END`,
        color: 'god-athena'
    },
    APHRODITE: {
        month: 'APR', greek: 'Ἀφροδίτη', english: 'APHRODITE',
        desc: 'Love, Beauty, Desire',
        chord: 349.23, // F4
        code: `# APHRODITE - Beauty in Strings\n# BEGIN\n  STRING rose := "beauty";\n  STRING thorn := "passion";\n  print(("Formed:", rose + " and " + thorn))\n# END`,
        color: 'god-aphrodite'
    },
    APOLLO: {
        month: 'MAY', greek: 'Ἀπόλλων', english: 'APOLLO',
        desc: 'Sun, Music, Prophecy',
        chord: 392.00, // G4
        code: `# APOLLO - Prophecy and Harmony\n# BEGIN\n  REAL prophecy := 0.0;\n  FOR day FROM 1 TO 7 DO\n    prophecy +:= sin(day * pi / 3.5)\n  OD;\n  print(("Solar cycle sum:", prophecy))\n# END`,
        color: 'god-apollo'
    },
    ARTEMIS: {
        month: 'JUN', greek: 'Ἄρτεμις', english: 'ARTEMIS',
        desc: 'Moon, Hunt, Wilderness',
        chord: 440.00, // A4
        code: `# ARTEMIS - Recursive Hunt\n# BEGIN\n  PROC hunt = (INT n) INT:\n    IF n <= 1 THEN n ELSE n + hunt(n-1) FI;\n  print(("Prey tracked:", hunt(10)))\n# END`,
        color: 'god-artemis'
    },
    ARES: {
        month: 'JUL', greek: 'Ἄρης', english: 'ARES',
        desc: 'War, Courage, Combat',
        chord: 493.88, // B4
        code: `# ARES - Parallel Combat\n# BEGIN\n  PAR (\n    print("Spear thrust!"),\n    print("Shield raised!"),\n    print("War cry!")\n  );\n  print(("Victory through parallel force"))\n# END`,
        color: 'god-ares'
    },
    HERMES: {
        month: 'AUG', greek: 'Ἑρμῆς', english: 'HERMES',
        desc: 'Messenger, Commerce, Thieves',
        chord: 523.25, // C5
        code: `# HERMES - Message Passing\n# BEGIN\n  SEMA messenger = 1;\n  DOWN messenger;\n  print(("Swift delivery: Message from Olympus"));\n  UP messenger\n# END`,
        color: 'god-hermes'
    },
    HEPHAESTUS: {
        month: 'SEP', greek: 'Ἥφαιστος', english: 'HEPHAESTUS',
        desc: 'Forge, Craft, Fire',
        chord: 587.33, // D5
        code: `# HEPHAESTUS - Operator Forging\n# BEGIN\n  OP TUPLE = (INT a, b) INT: a * b + a + b;\n  INT forged := 6 TUPLE 7;\n  print(("Forged artifact strength:", forged))\n# END`,
        color: 'god-hephaestus'
    },
    DEMETER: {
        month: 'OCT', greek: 'Δήμητρα', english: 'DEMETER',
        desc: 'Harvest, Agriculture, Grain',
        chord: 659.25, // E5
        code: `# DEMETER - Harvest Aggregation\n# BEGIN\n  [1:4] INT seasons := (100, 250, 400, 150);\n  INT total := 0;\n  FOR s IN seasons DO total +:= s OD;\n  print(("Annual harvest:", total, "bushels"))\n# END`,
        color: 'god-demeter'
    },
    DIONYSUS: {
        month: 'NOV', greek: 'Διόνυσος', english: 'DIONYSUS',
        desc: 'Wine, Ecstasy, Theatre',
        chord: 698.46, // F5
        code: `# DIONYSUS - Chaos and Union\n# BEGIN\n  UNION(WINE, MADNESS) goblet;\n  goblet := "aged 100 years";\n  CASE goblet IN\n    (STRING s): print(("Ecstasy:", s))\n  ESAC\n# END`,
        color: 'god-dionysus'
    },
    ZEUS: {
        month: 'DEC', greek: 'Ζεύς', english: 'ZEUS',
        desc: 'Sky, Thunder, King',
        chord: 783.99, // G5
        code: `# ZEUS - Thunder and Exception\n# BEGIN\n  PROC lightning = VOID: (\n    print("KERAUNOS!");\n    stop\n  );\n  lightning;\n  print(("This will not execute"))\n# END`,
        color: 'god-zeus'
    }
};

const state = {
    windows: [],
    activeGod: null,
    orbitPaused: false,
    audioContext: null,
    canvas: null,
    ctx: null
};

let time = 0;
const ORBIT_RADIUS = 350;
const CENTER_X = window.innerWidth / 2;
const CENTER_Y = window.innerHeight / 2;

// Initialize
function init() {
    state.canvas = document.getElementById('canvas-bg');
    state.ctx = state.canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    const stage = document.getElementById('stage');
    const godKeys = Object.keys(GODS);
    
    godKeys.forEach((key, i) => {
        const god = GODS[key];
        const window = createGodWindow(key, god, i);
        state.windows.push({ element: window, god, key, index: i, angle: i * (360 / 12) });
        stage.appendChild(window);
    });
    
    positionInCircle();
    animate();
    setupEventListeners();
}

function resizeCanvas() {
    state.canvas.width = window.innerWidth;
    state.canvas.height = window.innerHeight;
}

function createGodWindow(key, god, index) {
    const div = document.createElement('div');
    div.className = `god-window ${god.color}`;
    div.dataset.god = key;
    div.dataset.index = index;
    
    div.innerHTML = `
        <div class="window-header">
            <div class="god-info">
                <div class="god-name-greek">${god.greek}</div>
                <div class="god-name-english">${god.english}</div>
            </div>
            <div class="month-tag">${god.month}</div>
        </div>
        <div class="window-body">
            <textarea class="code-editor" spellcheck="false">${god.code}</textarea>
            <button class="run-btn">Invoke ${god.english}</button>
        </div>
    `;
    
    // Drag functionality
    let isDragging = false;
    let offsetX, offsetY;
    
    const header = div.querySelector('.window-header');
    header.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        div.classList.add('dragging');
        offsetX = e.clientX - div.offsetLeft;
        offsetY = e.clientY - div.offsetTop;
        state.orbitPaused = true;
        document.getElementById('pauseOrbit').textContent = 'RESUME ORBIT';
    });
    
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        div.style.left = (e.clientX - offsetX) + 'px';
        div.style.top = (e.clientY - offsetY) + 'px';
        drawConstellationLines();
    });
    
    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            div.classList.remove('dragging');
        }
    });
    
    // Click to focus
    div.addEventListener('click', (e) => {
        if (e.target.classList.contains('run-btn') || e.target.classList.contains('code-editor')) return;
        focusGod(key);
        playChord(god.chord);
    });
    
    // Double click to reset
    div.addEventListener('dblclick', resetFormation);
    
    // Run button
    div.querySelector('.run-btn').addEventListener('click', () => {
        const code = div.querySelector('.code-editor').value;
        executeCode(god, code);
    });
    
    return div;
}

function positionInCircle() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const radius = Math.min(window.innerWidth, window.innerHeight) * 0.32;
    
    state.windows.forEach((w, i) => {
        const angle = (i * 30 - 90) * Math.PI / 180; // Start at top
        const x = cx + radius * Math.cos(angle) - 190;
        const y = cy + radius * Math.sin(angle) - 210;
        w.element.style.left = x + 'px';
        w.element.style.top = y + 'px';
        w.element.style.zIndex = 10 + i;
        w.baseAngle = angle;
    });
}

function animate() {
    time += 0.002;
    
    if (!state.orbitPaused && !state.activeGod) {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const radius = Math.min(window.innerWidth, window.innerHeight) * 0.32;
        
        state.windows.forEach((w, i) => {
            if (w.element.classList.contains('dragging')) return;
            const angle = w.baseAngle + time;
            const x = cx + radius * Math.cos(angle) - 190;
            const y = cy + radius * Math.sin(angle) - 210;
            w.element.style.left = x + 'px';
            w.element.style.top = y + 'px';
        });
    }
    
    drawConstellationLines();
    requestAnimationFrame(animate);
}

function drawConstellationLines() {
    const ctx = state.ctx;
    ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
    
    if (!state.activeGod) return;
    
    const active = state.windows.find(w => w.key === state.activeGod);
    if (!active) return;
    
    const activeRect = active.element.getBoundingClientRect();
    const ax = activeRect.left + activeRect.width / 2;
    const ay = activeRect.top + activeRect.height / 2;
    
    ctx.strokeStyle = 'rgba(160, 168, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 10]);
    
    state.windows.forEach(w => {
        if (w.key === state.activeGod) return;
        const rect = w.element.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(x, y);
        ctx.stroke();
    });
    
    ctx.setLineDash([]);
}

function focusGod(godKey) {
    state.activeGod = godKey;
    state.windows.forEach(w => {
        if (w.key === godKey) {
            w.element.classList.add('active');
            w.element.classList.remove('dimmed');
            w.element.style.zIndex = 100;
        } else {
            w.element.classList.remove('active');
            w.element.classList.add('dimmed');
            w.element.style.zIndex = 10 + w.index;
        }
    });
}

function resetFormation() {
    state.activeGod = null;
    state.windows.forEach(w => {
        w.element.classList.remove('active', 'dimmed');
        w.element.style.zIndex = 10 + w.index;
    });
    positionInCircle();
}

function executeCode(god, code) {
    const output = document.getElementById('consoleOutput');
    
    // Simulate ALGOL 68 execution with thematic output
    let result = '';
    let className = 'success';
    
    if (code.includes('print')) {
        const match = code.match(/print\((.*?)\)/s);
        if (match) {
            result = `[${god.english}] ${match[1].replace(/[()]/g, '').replace(/"/g, '')}`;
        }
    } else if (code.includes('stop')) {
        result = `[${god.english}] THUNDER STRIKES - Execution halted by KERAUNOS`;
        className = 'error';
    } else if (code.includes('PAR')) {
        result = `[${god.english}] Parallel rites commenced`;
    } else {
        result = `[${god.english}] Rite compiled. No standard output.`;
        className = 'info';
    }
    
    const line = document.createElement('div');
    line.className = `console-line ${className}`;
    line.textContent = `> ${result}`;
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
}

function playChord(frequency) {
    if (!state.audioContext) {
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    const osc = state.audioContext.createOscillator();
    const gain = state.audioContext.createGain();
    
    osc.connect(gain);
    gain.connect(state.audioContext.destination);
    
    osc.frequency.value = frequency;
    osc.type = 'sine';
    
    gain.gain.setValueAtTime(0, state.audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, state.audioContext.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 1.5);
    
    osc.start(state.audioContext.currentTime);
    osc.stop(state.audioContext.currentTime + 1.5);
}

function setupEventListeners() {
    document.getElementById('pauseOrbit').addEventListener('click', () => {
        state.orbitPaused = !state.orbitPaused;
        document.getElementById('pauseOrbit').textContent = state.orbitPaused ? 'RESUME ORBIT' : 'PAUSE ORBIT';
    });
    
    document.getElementById('resetFormation').addEventListener('click', resetFormation);
    
    document.getElementById('clearConsole').addEventListener('click', () => {
        document.getElementById('consoleOutput').innerHTML = '';
    });
    
    // Keyboard controls 1-9,0,-,=
    const keyMap = ['HERA','POSEIDON','ATHENA','APHRODITE','APOLLO','ARTEMIS','ARES','HERMES','HEPHAESTUS','DEMETER','DIONYSUS','ZEUS'];
    const keys = ['1','2','3','4','5','6','7','8','9','0','-','='];
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            state.orbitPaused = !state.orbitPaused;
            document.getElementById('pauseOrbit').textContent = state.orbitPaused ? 'RESUME ORBIT' : 'PAUSE ORBIT';
        }
        
        const idx = keys.indexOf(e.key);
        if (idx !== -1) {
            focusGod(keyMap[idx]);
            playChord(GODS[keyMap[idx]].chord);
        }
    });
}

// Init on load
init();

// Welcome message
setTimeout(() => {
    const output = document.getElementById('consoleOutput');
    const line = document.createElement('div');
    line.className = 'console-line info';
    line.textContent = '> ΔΩΔΕΚΑΚΥΚΛΟΣ INITIALIZED // 11 + 1 = 12 // AWAIT INVOCATION';
    output.appendChild(line);
}, 500);
</script>
