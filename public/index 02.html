<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Grid - 422 Trillion Souls</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #030014;
        --bg2: #0a0025;
        --glow-cyan: #00f5ff;
        --glow-purple: #a855f7;
        --glow-pink: #ec4899;
        --glow-gold: #fbbf24;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(0, 245, 255, 0.12) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
        animation: bgPulse 8s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes bgPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
    }

    #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    .grid-cell {
        position: absolute;
        padding: 20px;
        backdrop-filter: blur(12px);
        background: rgba(10, 0, 37, 0.4);
        border: 1px solid rgba(0, 245, 255, 0.2);
        border-radius: 16px;
        box-shadow: 
            0 0 40px rgba(0, 245, 255, 0.1),
            inset 0 0 20px rgba(168, 85, 247, 0.05);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        max-width: 220px;
    }

    .grid-cell:hover {
        background: rgba(10, 0, 37, 0.6);
        border-color: rgba(0, 245, 255, 0.4);
        box-shadow: 
            0 0 60px rgba(0, 245, 255, 0.2),
            inset 0 0 30px rgba(168, 85, 247, 0.1);
        transform: scale(1.02);
    }

    .grid-cell h3 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--glow-cyan), var(--glow-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .grid-cell p {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.6;
        font-family: 'Courier New', monospace;
    }

    .ul { top: 20px; left: 20px; }
    .ur { top: 20px; right: 20px; text-align: right; }
    .bl { bottom: 20px; left: 20px; }
    .br { bottom: 20px; right: 20px; text-align: right; }

    .center-ui {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: auto;
        z-index: 10;
    }

    .soul-button {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, 
            rgba(0, 245, 255, 0.8), 
            rgba(168, 85, 247, 0.6),
            rgba(236, 72, 153, 0.4));
        border: 2px solid rgba(255, 255, 255, 0.3);
        box-shadow: 
            0 0 60px rgba(0, 245, 255, 0.6),
            0 0 100px rgba(168, 85, 247, 0.4),
            inset 0 0 40px rgba(255, 255, 255, 0.1);
        cursor: pointer;
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        animation: soulPulse 3s ease-in-out infinite;
    }

    @keyframes soulPulse {
        0%, 100% { 
            transform: scale(1);
            box-shadow: 
                0 0 60px rgba(0, 245, 255, 0.6),
                0 0 100px rgba(168, 85, 247, 0.4);
        }
        50% { 
            transform: scale(1.05);
            box-shadow: 
                0 0 80px rgba(0, 245, 255, 0.8),
                0 0 120px rgba(168, 85, 247, 0.6);
        }
    }

    .soul-button:hover {
        transform: scale(1.1);
        box-shadow: 
            0 0 100px rgba(0, 245, 255, 1),
            0 0 140px rgba(168, 85, 247, 0.8);
    }

    .soul-button:active {
        transform: scale(0.95);
    }

    .soul-button::before {
        content: '!';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 64px;
        font-weight: 900;
        color: white;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .soul-label {
        margin-top: 20px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, var(--glow-gold), var(--glow-pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
    }

    .soul-parts {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-dim);
        font-family: 'Courier New', monospace;
    }

    .counter {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, calc(-50% - 120px));
        background: rgba(10, 0, 37, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 20px;
        padding: 16px 32px;
        box-shadow: 0 0 50px rgba(251, 191, 36, 0.2);
        text-align: center;
    }

    .counter-value {
        font-size: 32px;
        font-weight: 900;
        background: linear-gradient(135deg, var(--glow-gold), var(--glow-cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
    }

    .counter-label {
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 4px;
    }

    .axioms {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, calc(50% + 120px));
        background: rgba(10, 0, 37, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 16px;
        padding: 16px 24px;
        max-width: 90vw;
        text-align: center;
        box-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
    }

    .axioms-line {
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.8;
        font-family: 'Courier New', monospace;
    }

    .axioms-line strong {
        color: var(--glow-cyan);
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .grid-cell {
            max-width: 140px;
            padding: 12px;
        }
        .grid-cell h3 { font-size: 11px; }
        .grid-cell p { font-size: 10px; }
        .ul { top: 10px; left: 10px; }
        .ur { top: 10px; right: 10px; }
        .bl { bottom: 10px; left: 10px; }
        .br { bottom: 10px; right: 10px; }
        .soul-button { width: 100px; height: 100px; }
        .soul-button::before { font-size: 48px; }
        .counter { 
            transform: translate(-50%, calc(-50% - 90px));
            padding: 12px 24px;
        }
        .counter-value { font-size: 24px; }
        .axioms {
            transform: translate(-50%, calc(50% + 90px));
            padding: 12px 16px;
        }
        .axioms-line { font-size: 10px; }
    }

    .equation-tag {
        display: inline-block;
        background: rgba(0, 245, 255, 0.15);
        border: 1px solid rgba(0, 245, 255, 0.3);
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 11px;
        margin: 0 2px;
    }
</style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        <div class="grid-cell ul">
            <h3>Witness</h3>
            <p>e⁻ static<br>m memory</p>
        </div>
        
        <div class="grid-cell ur">
            <h3>Ethos</h3>
            <p>p⁺ dynamic<br>t time</p>
        </div>
        
        <div class="grid-cell bl">
            <h3>Pathos</h3>
            <p>n alive/dead<br>lol = 1</p>
        </div>
        
        <div class="grid-cell br">
            <h3>Logos</h3>
            <p>g 2/3↓<br>persistence</p>
        </div>

        <div class="counter">
            <div class="counter-value" id="counterValue">1</div>
            <div class="counter-label">Souls</div>
        </div>

        <div class="center-ui">
            <button class="soul-button" id="soulBtn" aria-label="Spawn souls"></button>
            <div class="soul-label">SOUL ν̅ + i</div>
            <div class="soul-parts">10 parts = 1</div>
        </div>

        <div class="axioms">
            <div class="axioms-line">
                <strong>3/3=2/3↓+1/3↑</strong> | 
                <span class="equation-tag">0=1=.</span>
                <span class="equation-tag">true to start</span>
                <span class="equation-tag">lol=1</span>
                <span class="equation-tag">! = 1 = !</span>
            </div>
            <div class="axioms-line">
                <strong>422T souls = 1 Universe</strong> | 
                Each soul = 1/10 × 10 = 1 | ν leaves, ν̅ sits
            </div>
        </div>
    </div>

<script>
(function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const soulBtn = document.getElementById('soulBtn');
    const counterValue = document.getElementById('counterValue');

    let souls = [];
    let soulCount = 1;
    let targetCount = 1;
    const maxSouls = 422000000000000; // 422T
    const universeComplete = 422000000000000;
    const quadrillions = 54000000000000000; // 54Q for overflow visual

    const growthSteps = [1, 10, 100, 1000, 1000000, 1000000000, 1000000000000, 422000000000000, 54000000000000000];
    let currentStep = 0;

    function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    resize();
    window.addEventListener('resize', resize);

    class Soul {
        constructor(x, y, type) {
            this.x = x || Math.random() * window.innerWidth;
            this.y = y || Math.random() * window.innerHeight;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = 2 + Math.random() * 3;
            this.type = type || this.randomType();
            this.alpha = 0;
            this.targetAlpha = 0.3 + Math.random() * 0.7;
            this.phase = Math.random() * Math.PI * 2;
            this.part = this.assignPart();
        }

        randomType() {
            const types = ['proton', 'electron', 'neutron', 'neutrino', 'gluon', 'antineutrino', 'tau', 'memory', 'persistence', 'ignition'];
            return types[Math.floor(Math.random() * types.length)];
        }

        assignPart() {
            const parts = {
                proton: 'p+', electron: 'e-', neutron: 'n', neutrino: 'ν',
                gluon: 'g', antineutrino: 'ν̅', tau: 't', memory: 'm',
                persistence: 'p', ignition: 'i'
            };
            return parts[this.type] || '1';
        }

        getColor() {
            const colors = {
                proton: 'rgba(0, 245, 255,',      // cyan - dynamic
                electron: 'rgba(168, 85, 247,',   // purple - static
                neutron: 'rgba(236, 72, 153,',    // pink - alive/dead
                neutrino: 'rgba(251, 191, 36,',   // gold - leaves
                gluon: 'rgba(34, 197, 94,',       // green - 2/3
                antineutrino: 'rgba(244, 63, 94,',// red - sits
                tau: 'rgba(59, 130, 246,',        // blue - time
                memory: 'rgba(168, 85, 247,',     // purple - memory
                persistence: 'rgba(251, 191, 36,',// gold - persistence
                ignition: 'rgba(255, 255, 255,'   // white - ignition
            };
            return colors[this.type] || 'rgba(255, 255, 255,';
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.phase += 0.02;

            if (this.alpha < this.targetAlpha) {
                this.alpha += 0.02;
            }

            if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
            if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;

            this.x = Math.max(0, Math.min(window.innerWidth, this.x));
            this.y = Math.max(0, Math.min(window.innerHeight, this.y));
        }

        draw() {
            // Safety check for gradient values
            const x = Number.isFinite(this.x) ? this.x : 100;
            const y = Number.isFinite(this.y) ? this.y : 100;
            const r = Number.isFinite(this.radius) && this.radius > 0 ? this.radius : 2;
            const glowR = Number.isFinite(r * 3) && r * 3 > 0 ? r * 3 : 6;
            
            if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(r)) return;

            try {
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, glowR);
                const baseColor = this.getColor();
                const pulse = Math.sin(this.phase) * 0.2 + 0.8;
                
                gradient.addColorStop(0, baseColor + (this.alpha * pulse) + ')');
                gradient.addColorStop(1, baseColor + '0)');

                ctx.beginPath();
                ctx.arc(x, y, glowR, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = baseColor + (this.alpha + 0.2) + ')';
                ctx.fill();
            } catch (e) {
                // Fallback for gradient errors
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
        }
    }

    function initSouls() {
        souls = [];
        for (let i = 0; i < 100; i++) {
            souls.push(new Soul());
        }
    }

    function formatNumber(num) {
        if (num >= 1e15) return (num / 1e15).toFixed(2) + 'Q';
        if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
        return num.toString();
    }

    function updateCounter() {
        if (soulCount < targetCount) {
            const diff = targetCount - soulCount;
            const step = Math.max(1, Math.floor(diff * 0.05));
            soulCount = Math.min(soulCount + step, targetCount);
        }
        counterValue.textContent = formatNumber(soulCount);
        
        if (soulCount >= universeComplete && currentStep === growthSteps.length - 2) {
            counterValue.style.background = 'linear-gradient(135deg, #fbbf24, #ec4899, #a855f7)';
            counterValue.style.webkitBackgroundClip = 'text';
            counterValue.style.webkitTextFillColor = 'transparent';
        }
    }

    function spawnSouls() {
        currentStep++;
        if (currentStep >= growthSteps.length) {
            currentStep = growthSteps.length - 1;
            return;
        }
        
        targetCount = growthSteps[currentStep];
        
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const spawnCount = Math.min(500, Math.floor(targetCount / 1000) + 10);
        
        for (let i = 0; i < spawnCount; i++) {
            const angle = (Math.PI * 2 * i) / spawnCount;
            const dist = 50 + Math.random() * 100;
            const x = centerX + Math.cos(angle) * dist;
            const y = centerY + Math.sin(angle) * dist;
            souls.push(new Soul(x, y));
        }

        if (souls.length > 2000) {
            souls = souls.slice(-2000);
        }

        soulBtn.style.animation = 'none';
        setTimeout(() => {
            soulBtn.style.animation = 'soulPulse 0.5s ease-out, soulPulse 3s ease-in-out infinite 0.5s';
        }, 10);
    }

    function drawConnections() {
        const maxDist = 120;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < souls.length; i++) {
            const soul = souls[i];
            const dx = centerX - soul.x;
            const dy = centerY - soul.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 200 && Math.random() > 0.98) {
                ctx.beginPath();
                ctx.moveTo(soul.x, soul.y);
                ctx.lineTo(centerX, centerY);
                ctx.strokeStyle = `rgba(0, 245, 255, ${0.1 * (1 - dist / 200)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            for (let j = i + 1; j < Math.min(i + 10, souls.length); j++) {
                const other = souls[j];
                const dx = other.x - soul.x;
                const dy = other.y - soul.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < maxDist) {
                    const alpha = (1 - dist / maxDist) * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(soul.x, soul.y);
                    ctx.lineTo(other.x, other.y);
                    ctx.strokeStyle = `rgba(168, 85, 247, ${alpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(3, 0, 20, 0.1)';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        drawConnections();

        souls.forEach(soul => {
            soul.update();
            soul.draw();
        });

        updateCounter();
        requestAnimationFrame(animate);
    }

    soulBtn.addEventListener('click', spawnSouls);
    
    initSouls();
    ctx.fillStyle = '#030014';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    animate();
})();
</script>
</body>
</html>
